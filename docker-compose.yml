version: '3.8'

services:
  # ---------------------
  # 1. PostgreSQL
  # ---------------------
  postgres:
    image: postgres:15
    container_name: refnet_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: referraldb
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  pgadmin:
    image: dpage/pgadmin4
    container_name: refnet_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@refnet.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres

  # ---------------------
  # 2. Backend API (Dev)
  # ---------------------
  server:
    image: node:20-alpine
    container_name: refnet_server_dev
    working_dir: /app
    volumes:
      - ./server:/app
      - /app/node_modules # Prevent overwriting node_modules inside container
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=development
      - PG_URI=postgresql://postgres:password@postgres:5432/referraldb
    command: sh -c "npm install && npm run dev"
    depends_on:
      - postgres

  # ---------------------
  # 3. Frontend Client (Dev)
  # ---------------------
  client:
    image: node:20-alpine
    container_name: refnet_client_dev
    working_dir: /app
    volumes:
      - ./client:/app
      - /app/node_modules # Prevent overwriting node_modules inside container
    ports:
      - '5173:5173'
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - server

volumes:
  postgres_data: